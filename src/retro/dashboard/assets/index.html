<script>
window.RETRO = {data: {}, waiters: {}, loading: {}, failed: {}};
function RETRO_DATA(name, payload) {
  window.RETRO.data[name] = payload;
  var queue = window.RETRO.waiters[name];
  if (queue) {
    delete window.RETRO.waiters[name];
    for (var i = 0; i < queue.length; i++) { queue[i](payload); }
  }
}
</script>
</head>
