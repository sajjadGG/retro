[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retro-ai"
version = "0.3.0"
description = "Capture, analyze, and mine Codex, Claude Code, and VS Code Copilot rollouts."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
sandbox = [
    "ghostlab>=0.3.0,<0.4; python_version >= '3.10'",
]
dev = [
    "pytest>=8",
    "mypy>=1.10,<2",
    "ruff>=0.4",
]

[project.scripts]
retro = "retro.cli:app"

[project.urls]
Homepage = "https://github.com/sajjadGG/retro"
Repository = "https://github.com/sajjadGG/retro"
Issues = "https://github.com/sajjadGG/retro/issues"
Changelog = "https://github.com/sajjadGG/retro/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/retro"]

[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# HTML-template modules moved in from dashboard/; never type-checked before.
module = ["retro.dashboard_build", "retro.dashboard_experiments"]
ignore_errors = true

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Generated-HTML modules: long template lines are deliberate.
"src/retro/dashboard_build.py" = ["E501"]
"src/retro/dashboard_experiments.py" = ["E501"]
# Typer evaluates CLI annotations at runtime; Optional is required on Python 3.9.
"src/retro/cli.py" = ["UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
